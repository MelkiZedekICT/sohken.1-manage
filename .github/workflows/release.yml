name: Build and publish Sohken downloads

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check third-party packages for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:sdk
      - run: npm run package:desktop
      - run: npm run package:release
      - name: Publish downloadable files
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.tgz', '.json' }
          if (-not $assets) { throw 'No Sohken release files were built.' }
          $ghArgs = @('release', 'create', $tag, '--generate-notes')
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          $ghArgs += $assets.FullName
          gh @ghArgs
