name: Build and publish Sohken downloads

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:sdk
      - run: npm run package:desktop
      - run: npm run package:release
      - name: Publish downloadable files
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.tgz', '.json' }
          if (-not $assets) { throw 'No Sohken release files were built.' }
          $ghArgs = @('release', 'create', $tag, '--generate-notes')
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          $ghArgs += $assets.FullName
          gh @ghArgs
