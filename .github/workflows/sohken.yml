name: Sohken checks, downloads and website
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: What to run by hand
        type: choice
        options: [verify, publish-site]
        default: verify
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.task == 'verify' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check packages for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:sdk

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:desktop
      - run: npm run package:release
      - name: Publish downloadable files
        shell: powershell
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip', '.tgz', '.json' }
          if (-not $assets) { throw 'No Sohken release files were built.' }
          $ghArgs = @('release','create', $tag, '--generate-notes')
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          $ghArgs += $assets.FullName
          gh @ghArgs

  publish-site:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'publish-site')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Deploy static site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
